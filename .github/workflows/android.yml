name: Android build and physics prototype
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install target Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and inspect app
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Print physics-audit summary
        if: always()
        shell: bash
        run: |
          if ls app/build/test-results/testDebugUnitTest/TEST-*.xml >/dev/null 2>&1; then
            python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for file in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=ET.parse(file).getroot()
              for test in root.iter('testcase'):
                  for failure in test.findall('failure'):
                      print('STAGE_TEST_FAILURE:',test.get('name'),failure.get('message')[:10000])
              for system in root.findall('system-out'):
                  for line in (system.text or '').splitlines():
                      if 'PHYSICS_' in line: print(line[:10000])
          PY
          fi
      - name: Copy JBox2D runtime for standalone level simulation
        run: |
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.jbox2d/jbox2d-library" -name '*.jar' -print -quit | xargs -r -I{} cp '{}' jbox2d-library.jar
          test -s jbox2d-library.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jbox2d-physics-runtime
          path: jbox2d-library.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug APK (testing, not store release)
        uses: actions/upload-artifact@v4
        with:
          name: BallDropChainReaction-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
